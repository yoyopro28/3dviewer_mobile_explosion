<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile 3D FPS Viewer</title>

  <style>
    html, body { margin: 0; padding: 0; width:100vw; height:100vh; overflow: hidden; }
    body { background: #1d1d1d; }
    canvas { display: block; touch-action: none; }

    #loadingSpinner {
      position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
      background:rgba(30,30,30,0.85); color:#3fcf8e;
      font-family:sans-serif; font-size:1.1em; padding:1.5em 3em; border-radius:18px;
      z-index:150;
    }

    #menu { 
      position: absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      background:rgba(30,30,30,0.98); color:#fff; padding:2em 3vw; border-radius:18px; text-align:center;
      font-family:sans-serif; box-shadow: 0 16px 64px rgba(0,0,0,0.35);
      z-index:100; min-width:230px; max-width:96vw; display:none;
    }
    #menu label { display:block; margin-bottom:0.7em; font-size:1.08em; }
    #menu input[type="range"] { width:90vw; }
    #menu .slider-tip { color:#aaa; font-size:0.95em; margin-bottom:0.6em; }
    #menu input[type="checkbox"] { transform: scale(1.2); margin-right:0.5em; }
    #menu button {
      background:#3fcf8e; color:#222; border:none; padding:0.7em 2em; border-radius:11px;
      font-size:1em; margin-top:1.2em;
    }
    #menu button:last-child { background:#222; color:#3fcf8e; margin-left:1em;}

    /* Debug / calibration line */
    #debugLine {
      margin-top: 1.1em;
      color:#9aa;
      font-size:0.92em;
      line-height:1.25;
      text-align:left;
      padding:0.7em 0.9em;
      border-radius:12px;
      background: rgba(0,0,0,0.22);
      user-select:text;
      -webkit-user-select:text;
      word-break: break-word;
    }

    #mobileControls { pointer-events:none; }
    #mobileControls * { pointer-events:auto; user-select:none; -webkit-user-select:none; }

    @media (max-width:600px) {
      #menu { padding:1em 2vw; }
      #menu label { font-size:1em; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
</head>

<body>
  <div id="loadingSpinner">Lade Modell ...</div>

  <div id="menu">
    <label for="speedSlider">Bewegungsgeschwindigkeit: <span id="speedValue">0</span></label>
    <!-- CALIBRATED: smaller, more usable range -->
    <input type="range" min="0.5" max="30" step="0.1" id="speedSlider" value="6">
    <div class="slider-tip">(Sprint: <span id="sprintValue">0</span>) — Auto-Sprint bei starkem Joystick</div>

    <label for="scaleSlider" style="margin-top:1.4em;">Modell-Scale: <span id="scaleValue">0</span></label>
    <input type="range" min="0.001" max="5" step="0.001" id="scaleSlider" value="0.025">
    <div class="slider-tip">Tipp: Wenn Speed/Explode komisch wirkt → Scale oder Auto-Gap prüfen</div>

    <label style="margin-top:1.4em;"><input type="checkbox" id="flyToggle">Flugmodus aktivieren</label>

    <button id="toggleExplode">Schichten aufklappen</button>

    <button id="resetPosition">Zurück zum Start</button>
    <button id="closeMenu">Schließen</button>

    <!-- Debug line for calibration -->
    <div id="debugLine" style="display:none;"></div>
  </div>

  <div id="mobileControls" style="display:none;">
    <div id="joystickZone" style="position:fixed; left:10px; bottom:10px; width:110px; height:110px; z-index:50;"></div>
    <div style="position:fixed; right:12px; bottom:12px; z-index:50; display:flex; flex-direction:column; gap:12px;">
      <button id="btnUp" style="width:48px;height:48px;border-radius:50%;background:#3fcf8e;color:#222;font-size:1.3em;">↑</button>
      <button id="btnDown" style="width:48px;height:48px;border-radius:50%;background:#3fcf8e;color:#222;font-size:1.3em;">↓</button>
      <button id="btnMenu" style="width:48px;height:48px;border-radius:50%;background:#222;color:#3fcf8e;font-size:1.08em;">≡</button>
      <button id="btnExplode" style="width:48px;height:48px;border-radius:50%;background:#222;color:#3fcf8e;font-size:0.95em;">⤢</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const MODEL_URL = './model.glb';

    let camera, scene, renderer;
    let model, groundMeshes = [];
    let modelScale = 0.0025;

    // --- Calibration / "meter-ish" controls ---
    // These are *world units per second*. If your model is extremely tiny,
    // speed will feel huge -> use scale slider or auto gap will keep explode reasonable.
    let speed = { base: 0, sprint: 0 };
    let sprintMultiplier = 2.0;

    // Auto-sprint on mobile when joystick force is high
    const AUTO_SPRINT_FORCE = 0.75;

    // Vertical movement (fly) multiplier to keep it controllable
    const FLY_SPEED_MULT = 0.85;

    // Eye height / ray settings
    let eyeHeight = 1.6;          // can be re-fit on load if model tiny/huge
    let groundRayLen = 3.5;       // will be tuned from model size
    let groundLevel = eyeHeight;  // used for fallback
    let gravity = -22;            // will be tuned from model size

    let velocityY = 0;
    let flying = false;
    let paused = false;
    let onGround = false;
    let yaw = 0, pitch = 0;
    let cameraHolder, cameraPitch;
    let sprinting = false;

    let startPosition = new THREE.Vector3(0, groundLevel, 5);
    const clock = new THREE.Clock();

    // Analog Joystick Input
    let joystickInput = { x: 0, y: 0, force: 0 };
    // separates vertical fly control from joystick
    let verticalInput = 0;

    // Explode / Layer animation
    let layers = []; // [{ obj, restPos, basePos, targetPos }]
    let exploded = false;
    let explodeAnim = { active:false, t:0, duration:0.6 };
    let explodeGap = 1; // will be auto-calculated from model size

    // UI Elements
    const loadingSpinner = document.getElementById('loadingSpinner');
    const menu = document.getElementById('menu');

    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const sprintValue = document.getElementById('sprintValue');

    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');

    const resetBtn = document.getElementById('resetPosition');
    const closeMenuBtn = document.getElementById('closeMenu');
    const flyToggle = document.getElementById('flyToggle');

    const toggleExplodeBtn = document.getElementById('toggleExplode');

    const mobileControls = document.getElementById('mobileControls');
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');
    const btnMenu = document.getElementById('btnMenu');
    const btnExplode = document.getElementById('btnExplode');

    const debugLine = document.getElementById('debugLine');
    // show debug line only if you want:
    const SHOW_DEBUG = true;
    if (debugLine) debugLine.style.display = SHOW_DEBUG ? 'block' : 'none';

    // Touch‐Look State
    let cameraTouchActive = false;
    let cameraTouchId = null;
    let lastTouchX = 0, lastTouchY = 0;
    const touchLookFactor = 0.0027;

    // Sprint per Shift-Taste (desktop)
    window.addEventListener('keydown', e => { if (e.key === 'Shift') sprinting = true; });
    window.addEventListener('keyup',   e => { if (e.key === 'Shift') sprinting = false; });

    // Fly-Mode Toggle
    flyToggle.addEventListener('change', e => { flying = e.target.checked; });

    window.addEventListener('DOMContentLoaded', () => {
      loadingSpinner.style.display = 'block';
      startAppWithModel(MODEL_URL);
    });

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function updateSpeedUI() {
      speedValue.textContent = speed.base.toFixed(1);
      sprintValue.textContent = speed.sprint.toFixed(1);
    }

    function updateScaleUI() {
      // higher precision so it doesn't show 0.00
      scaleValue.textContent = modelScale.toFixed(4);
    }

    function syncSpeedFromSlider() {
      speed.base = parseFloat(speedSlider.value);
      speed.sprint = speed.base * sprintMultiplier;
      updateSpeedUI();
    }

    // Ensure UI and runtime match immediately
    syncSpeedFromSlider();
    updateScaleUI();

    speedSlider.oninput = () => {
      syncSpeedFromSlider();
      updateDebugLine();
    };

    scaleSlider.oninput = () => {
      scaleModel(parseFloat(scaleSlider.value));
      // model size changes -> recalibrate dependent params
      recalibrateFromModel();
      updateDebugLine();
    };

    resetBtn.onclick = () => resetPosition();
    closeMenuBtn.onclick = () => menu.style.display = 'none';

    toggleExplodeBtn.onclick = () => toggleExplode();
    if (btnExplode) {
      btnExplode.addEventListener('touchend', e => {
        e.preventDefault();
        toggleExplode();
      }, { passive:false });
    }

    function scaleModel(newScale) {
      if (!model) return;
      model.scale.set(newScale, newScale, newScale);
      modelScale = newScale;
      // Do NOT round slider value (avoid lying)
      scaleSlider.value = String(modelScale);
      updateScaleUI();
    }

    function resetPosition() {
      cameraHolder.position.copy(startPosition);
      velocityY = 0;
    }

    // ---- Explode helpers ----
    function parseLayerIndex(name) {
      const m = /^L_(\d+)/.exec(name || "");
      return m ? parseInt(m[1], 10) : Number.POSITIVE_INFINITY;
    }

    function collectLayersFromModel(root) {
      const candidates = [];
      root.traverse(obj => {
        if (obj.name && obj.name.startsWith("L_")) candidates.push(obj);
      });

      if (candidates.length === 0) {
        root.children.forEach(ch => {
          let hasGeo = false;
          ch.traverse(n => { if (n.isMesh && n.geometry) hasGeo = true; });
          if (hasGeo) candidates.push(ch);
        });
      }

      return candidates.map(obj => {
        const box = new THREE.Box3().setFromObject(obj);
        const center = new THREE.Vector3();
        box.getCenter(center);
        return {
          obj,
          restPos: obj.position.clone(),
          basePos: obj.position.clone(),
          yCenter: center.y,
          targetPos: obj.position.clone()
        };
      }).sort((a,b) => parseLayerIndex(a.obj.name) - parseLayerIndex(b.obj.name));
    }

    function setExplodeTargets(open) {
      if (!layers.length) return;

      for (let i = 0; i < layers.length; i++) {
        if (open) {
          const offsetY = i * explodeGap;
          layers[i].targetPos = layers[i].restPos.clone().add(new THREE.Vector3(0, offsetY, 0));
        } else {
          layers[i].targetPos = layers[i].restPos.clone();
        }
      }
    }

    function startExplodeAnimation(open) {
      exploded = open;
      explodeAnim.active = true;
      explodeAnim.t = 0;
      setExplodeTargets(open);
      toggleExplodeBtn.textContent = open ? "Schichten schließen" : "Schichten aufklappen";
    }

    function toggleExplode() {
      if (!model) return;

      if (!layers.length) layers = collectLayersFromModel(model);

      // animation starts from current position
      for (const L of layers) L.basePos = L.obj.position.clone();

      startExplodeAnimation(!exploded);
      updateDebugLine();
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
    }

    function updateExplodeAnimation(delta) {
      if (!explodeAnim.active || !layers.length) return;

      explodeAnim.t += delta;
      const u = Math.min(explodeAnim.t / explodeAnim.duration, 1);
      const e = easeInOutCubic(u);

      for (const L of layers) {
        const from = L.basePos;
        const to = L.targetPos ?? L.basePos;
        L.obj.position.lerpVectors(from, to, e);
      }

      if (u >= 1) explodeAnim.active = false;
    }
    // ------------------------

    function startAppWithModel(url) {
      if (!scene) {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);

        cameraPitch = new THREE.Object3D();
        cameraHolder = new THREE.Object3D();
        cameraPitch.add(camera);
        cameraHolder.add(cameraPitch);
        scene.add(cameraHolder);

        cameraHolder.position.copy(startPosition);
        cameraPitch.rotation.x = pitch;
        cameraHolder.rotation.y = yaw;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));
        let dirLight = new THREE.DirectionalLight(0xffffff,1);
        dirLight.position.set(0,200,100);
        dirLight.castShadow=true;
        scene.add(dirLight);

        mobileControls.style.display = '';
        enableMobileControls();

        // make sure UI and runtime match from start
        syncSpeedFromSlider();
        updateScaleUI();
        animate();

        window.addEventListener('resize', ()=>{
          camera.aspect = window.innerWidth/window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      loadingSpinner.style.display = 'block';

      new GLTFLoader().load(url, gltf => {
        loadingSpinner.style.display = 'none';

        if (model) scene.remove(model);

        model = gltf.scene;
        model.scale.set(modelScale, modelScale, modelScale);
        model.position.set(0,0,0);
        scene.add(model);

        // collect layer nodes (L_01, L_02, ...)
        layers = collectLayersFromModel(model);
        exploded = false;
        toggleExplodeBtn.textContent = "Schichten aufklappen";

        groundMeshes = [];
        gltf.scene.traverse(child => {
          if (child.isMesh) groundMeshes.push(child);
        });

        // Recalibrate dependent parameters from actual model size
        recalibrateFromModel();

        // Spawn at model center, find ground below
        const box = new THREE.Box3().setFromObject(model);
        const spawnX = (box.min.x + box.max.x)/2;
        const spawnZ = (box.min.z + box.max.z)/2;

        const ray = new THREE.Raycaster(
          new THREE.Vector3(spawnX, box.max.y + 9999, spawnZ),
          new THREE.Vector3(0,-1,0), 0, 2e7
        );

        const hits = ray.intersectObjects(groundMeshes, false);
        let y = groundLevel;
        if (hits.length) y = hits[0].point.y + eyeHeight;

        startPosition.set(spawnX, y, spawnZ);
        cameraHolder.position.copy(startPosition);

        updateDebugLine();

      }, undefined, err => {
        loadingSpinner.style.display = 'none';
        alert("Fehler beim Laden der Datei!");
      });
    }

    function recalibrateFromModel() {
      if (!model) return;

      // Measure scaled model size
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);

      // Derive explodeGap from model height (safe even if tiny)
      // Aim: 2% of height, clamped to a sane range.
      const h = Math.max(size.y, 1e-6);
      explodeGap = clamp(h * 0.02, 0.02, 50);

      // Tune ray length based on model size: enough to catch ground when stepping
      // If the model is tiny, keep a minimum.
      groundRayLen = clamp(Math.max(eyeHeight * 2.2, h * 0.06), 1.2, 50);

      // Tune gravity: if model is huge, a bit stronger feels better. If tiny, reduce.
      // This keeps "fall time" in a reasonable range across scales.
      const scaleFactor = clamp(h / 10, 0.25, 4.0); // relative to a "10 units tall" scene
      gravity = -22 * scaleFactor;

      // groundLevel fallback uses eyeHeight (keeps camera above ground)
      groundLevel = eyeHeight;

      // If we are currently exploded and you change scale, keep animation targets consistent
      if (exploded) setExplodeTargets(true);
    }

    function enableMobileControls() {
      // Joystick
      const joystickManager = nipplejs.create({
        zone: document.getElementById('joystickZone'),
        mode: 'dynamic',
        color: '#3fcf8e',
        size: 80
      });

      joystickManager.on('move', (evt, data) => {
        joystickInput.x = data.vector.x;
        joystickInput.y = data.vector.y;
        joystickInput.force = Math.min(data.force, 1);
      });

      joystickManager.on('end', () => {
        joystickInput.x = joystickInput.y = joystickInput.force = 0;
      });

      // ↑-Button: fliegt nach oben
      btnUp.addEventListener('touchstart', e => {
        e.preventDefault();
        verticalInput =  1;
      }, { passive: false });

      btnUp.addEventListener('touchend', e => {
        e.preventDefault();
        verticalInput =  0;
      }, { passive: false });

      // ↓-Button: fliegt nach unten
      btnDown.addEventListener('touchstart', e => {
        e.preventDefault();
        verticalInput = -1;
      }, { passive: false });

      btnDown.addEventListener('touchend', e => {
        e.preventDefault();
        verticalInput =  0;
      }, { passive: false });

      btnMenu.addEventListener('touchend', e => {
        e.preventDefault();
        menu.style.display='block';
        updateDebugLine();
      }, { passive:false });

      // Kamera‐Touch (rechte Bildschirmhälfte)
      renderer.domElement.addEventListener('touchstart', e => {
        for (let touch of e.changedTouches) {
          if (cameraTouchId === null && touch.clientX > window.innerWidth / 2) {
            cameraTouchId = touch.identifier;
            cameraTouchActive = true;
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
          }
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchmove', e => {
        if (!cameraTouchActive) return;
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) {
            const dx = touch.clientX - lastTouchX;
            const dy = touch.clientY - lastTouchY;

            yaw   -= dx * touchLookFactor;
            pitch -= dy * touchLookFactor;

            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            cameraHolder.rotation.y = yaw;
            cameraPitch.rotation.x = pitch;

            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
            e.preventDefault();
          }
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchend', e => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === cameraTouchId) {
            cameraTouchActive = false;
            cameraTouchId = null;
          }
        }
      }, { passive: false });
    }

    function updateDebugLine() {
      if (!SHOW_DEBUG || !debugLine) return;

      let sizeStr = "n/a";
      let layerCount = layers?.length ?? 0;

      if (model) {
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        sizeStr = `${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;
      }

      debugLine.innerHTML =
        `Model size: ${sizeStr}<br>` +
        `Scale: ${modelScale.toFixed(4)} | EyeHeight: ${eyeHeight.toFixed(2)} | RayLen: ${groundRayLen.toFixed(2)}<br>` +
        `Speed: ${speed.base.toFixed(1)} / Sprint: ${(speed.base*sprintMultiplier).toFixed(1)} (x${sprintMultiplier.toFixed(2)})<br>` +
        `Gravity: ${gravity.toFixed(1)} | ExplodeGap: ${explodeGap.toFixed(2)} | Layers: ${layerCount}`;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!renderer || !camera) return;

      const delta = clock.getDelta();

      // update explode animation (runs even if paused)
      updateExplodeAnimation(delta);

      if (!paused) {
        // Auto sprint for mobile joystick
        const sprintingMobile = joystickInput.force > AUTO_SPRINT_FORCE;
        const currentSpeed = (sprinting || sprintingMobile) ? speed.sprint : speed.base;

        // Movement vector from analog joystick (horizontal only)
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        dir.y = 0; dir.normalize();

        const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

        const v = new THREE.Vector3();
        v.addScaledVector(dir,   joystickInput.y * joystickInput.force);
        v.addScaledVector(right, joystickInput.x * joystickInput.force);
        if (v.length() > 1) v.normalize();

        v.multiplyScalar(currentSpeed * delta);
        cameraHolder.position.add(v);

        // Vertical movement only via buttons (scaled for feel)
        if (flying) {
          cameraHolder.position.y += verticalInput * currentSpeed * FLY_SPEED_MULT * delta;
          velocityY = 0; // avoid carrying gravity into non-fly
        } else {
          velocityY += gravity * delta;
          let nextY = cameraHolder.position.y + velocityY * delta;

          const downRay = new THREE.Raycaster(
            new THREE.Vector3(cameraHolder.position.x, cameraHolder.position.y, cameraHolder.position.z),
            new THREE.Vector3(0,-1,0), 0, groundRayLen
          );

          const hits = downRay.intersectObjects(groundMeshes, false);
          let surfaceY = groundLevel;

          if (hits.length) {
            surfaceY = hits[0].point.y + eyeHeight;
            if (nextY <= surfaceY) {
              nextY = surfaceY;
              velocityY = 0;
              onGround = true;
            } else {
              onGround = false;
            }
          }
          cameraHolder.position.y = nextY;
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
